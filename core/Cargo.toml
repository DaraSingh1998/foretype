[package]
name = "foretype-core"
version = "0.1.11"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Portable inline-autocomplete engine: context building, llama.cpp inference with prefix-cache reuse and token healing, suggestion session state."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
ureq = "2"

[profile.release]
debug = 1
lto = "thin"
