<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="t d">
  <title id="t">Foretype suggesting the rest of a sentence</title>
  <desc id="d">An email being written in a Mac app. After the caret, Foretype shows the rest of the sentence in gray: "and send you my notes by Friday." Below, the keys: Tab takes the next word, the key above Tab takes all of it, Esc dismisses.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { font-size: 14px; fill: #8a8a8e; }
      .field { font-size: 14px; fill: #1d1d1f; }
      .body { font-size: 17px; fill: #1d1d1f; }
      .ghost { fill: #a1a1a6; }
      .caret { fill: #0a66d8; font-weight: 400; }
      .key { font-size: 13px; fill: #1d1d1f; font-weight: 600; }
      .hint { font-size: 14px; fill: #6e6e73; }
    </style>
  </defs>

  <!-- Window -->
  <rect x="20" y="14" width="720" height="268" rx="12" fill="#ffffff" stroke="#d2d2d7" filter="url(#shadow)"/>
  <path d="M20 224h720v46a12 12 0 0 1-12 12H32a12 12 0 0 1-12-12z" fill="#f5f5f7"/>
  <line x1="20" y1="224" x2="740" y2="224" stroke="#e5e5ea"/>
  <path d="M32 14h696a12 12 0 0 1 12 12v24H20V26a12 12 0 0 1 12-12z" fill="#f5f5f7"/>
  <line x1="20" y1="50" x2="740" y2="50" stroke="#e5e5ea"/>
  <circle cx="42" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="32" r="6" fill="#febc2e"/>
  <circle cx="82" cy="32" r="6" fill="#28c840"/>
  <text class="ui" x="380" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#4a4a4f">New Message</text>

  <!-- Header fields -->
  <text class="ui label" x="44" y="78">To:</text>
  <text class="ui field" x="96" y="78">Sam</text>
  <line x1="44" y1="90" x2="716" y2="90" stroke="#ececf0"/>
  <text class="ui label" x="44" y="112">Subject:</text>
  <text class="ui field" x="104" y="112">Draft for Thursday</text>
  <line x1="44" y1="124" x2="716" y2="124" stroke="#ececf0"/>

  <!-- Body: typed text, caret, ghost text -->
  <text class="ui body" x="44" y="160">Hi Sam,</text>
  <text class="ui body" x="44" y="192">Thanks for sending the draft over. I’ll read it tonight<tspan class="caret" dx="1">|</tspan><tspan class="ghost" dx="1"> and send you my notes by Friday.</tspan></text>

  <!-- Keys -->
  <g class="ui">
    <rect x="182" y="240" width="44" height="26" rx="6" fill="#ffffff" stroke="#c7c7cc"/>
    <text class="key" x="204" y="258" text-anchor="middle">Tab</text>
    <text class="hint" x="234" y="258">next word</text>

    <rect x="342" y="240" width="30" height="26" rx="6" fill="#ffffff" stroke="#c7c7cc"/>
    <text class="key" x="357" y="261" text-anchor="middle" font-size="17">`</text>
    <text class="hint" x="380" y="258">all of it</text>

    <rect x="478" y="240" width="40" height="26" rx="6" fill="#ffffff" stroke="#c7c7cc"/>
    <text class="key" x="498" y="258" text-anchor="middle">Esc</text>
    <text class="hint" x="526" y="258">dismiss</text>
  </g>
</svg>
